<div
  id="linkedin-paste-warning-overlay"
  class="linkedin-warning-overlay"
>
  <div class="linkedin-warning-modal">

    <button
      id="linkedin-warning-close"
      class="linkedin-warning-close"
      type="button"
      aria-label="Close"
    >
      &times;
    </button>

    <h1 class="linkedin-warning-title">
      Beware the LinkedIn!
    </h1>

    <p class="linkedin-warning-message">
      You have pasted someone else's LinkedIn URL!
    </p>

    <div class="linkedin-warning-section">
        <div class="linkedin-warning-label">
          Expected:
        </div>
      
        <div class="linkedin-warning-expected-row">
      
          <h1
            id="linkedin-warning-expected"
            class="linkedin-warning-url linkedin-warning-expected"
          ></h1>
      
          <button
            id="linkedin-warning-copy"
            class="linkedin-warning-copy"
            type="button"
            aria-label="Copy expected LinkedIn URL"
          >
            Copy
          </button>
      
        </div>
    </div>

    <div class="linkedin-warning-section">
      <div class="linkedin-warning-label">
        You have pasted:
      </div>

      <h1
        id="linkedin-warning-pasted"
        class="linkedin-warning-url linkedin-warning-pasted"
      ></h1>
    </div>

  </div>
</div>
